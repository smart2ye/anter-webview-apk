name: Build ANTER APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read version from gradle
        id: version
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ANTER-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: Prepare release file
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk release-out/ANTER_app.apk
          ls -la release-out/

      - name: Publish versioned release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "ANTER ${{ steps.version.outputs.VERSION }}"
          body: |
            آخر بناء تلقائي من فرع main.
            commit: ${{ github.sha }}
          files: release-out/ANTER_app.apk
          make_latest: true
          overwrite_files: true
