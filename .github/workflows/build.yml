name: Build ANTER APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          ls -la "$RUNNER_TEMP/keys/"

      - name: Read version from gradle
        id: version
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keys/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify signing
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ANTER-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: Prepare release file
        run: |
          mkdir -p release-out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" release-out/ANTER_app.apk
          ls -la release-out/

      - name: Publish versioned release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "ANTER ${{ steps.version.outputs.VERSION }}"
          body: |
            إصدار موقّع من فرع main.
            commit: ${{ github.sha }}
          files: release-out/ANTER_app.apk
          make_latest: true
          overwrite_files: true
